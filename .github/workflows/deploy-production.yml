name: Deploy Fabric production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      recreate_analytics_items:
        description: Recreate Gold_SM and Gold_Dashboard under the deployment SPN
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: fabric-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    steps:
      - name: Check out approved main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-deploy.txt

      - name: Install deployment dependencies
        run: python -m pip install --requirement requirements-deploy.txt

      - name: Validate approved source
        run: python scripts/validate_repository.py

      - name: Deploy changed Fabric definitions
        shell: bash
        run: |
          args=(
            --target-workspace "${{ vars.FABRIC_PROD_WORKSPACE }}"
            --dev-workspace "${{ vars.FABRIC_DEV_WORKSPACE }}"
            --git-compare-ref "${{ github.event.before || 'HEAD~1' }}"
            --environment Production
          )
          if [[ "${{ inputs.recreate_analytics_items }}" == "true" ]]; then
            args+=(--recreate-analytics-items)
          fi
          python scripts/deploy_to_fabric.py "${args[@]}"