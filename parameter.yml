# ============================================================================
# fabric-cicd parameterization — PL_Refresh_Master CI/CD binding-as-code
# ============================================================================
# This file REPLACES the post-deploy repair that NB_04 used to do. Instead of
# fixing GUIDs AFTER the deployment pipeline copies items, fabric-cicd injects
# the correct TARGET-stage GUIDs WHILE it publishes each item from Git. The
# items land already-bound — no repair pass needed.
#
# How the dynamic variables resolve (at deploy time, against the TARGET ws):
#   $workspace.$id                              -> the workspace being published into
#   $items.Notebook.<DisplayName>.$id           -> that notebook's id in the target ws
#   $items.Dataflow.DF_Gold_PA.$id              -> the dataflow's id in the target ws
#   $items.SemanticModel.Gold_SM.$id            -> the semantic model's id in the target ws
#   $items.Lakehouse.<DisplayName>.$id          -> resolved against EXISTING lakehouses
#                                                  in the target ws (lakehouses are created
#                                                  by workspace setup, not deployed here)
#
# Every find_value below is a DEV (source-workspace) literal GUID. Replace the
# <DEV_*_GUID> placeholders with your real Dev GUIDs, then the same file works
# for every target stage because the replace_value is a dynamic variable.
#
# Item DisplayNames must match EXACTLY what the items are called in the target
# workspace (case-sensitive). Adjust if your notebook/model names differ.
# ----------------------------------------------------------------------------

find_replace:

  # --- 1. Dev workspace id -> target workspace id ---------------------------
  # One global replace fixes the workspaceId in EVERY pipeline activity
  # (TridentNotebook.workspaceId, RefreshDataflow.workspaceId, the
  # PBISemanticModelRefresh groupId) AND any default-lakehouse workspace id
  # embedded in the notebook bindings. This is the core fix for
  # "notebooks in the data pipeline are pointed to the Dev workspace".
  - find_value: "292e18c3-b95e-42d1-bb02-9a2064fee5b8"
    replace_value:
      Development: "$workspace.$id"
      Production: "$workspace.$id"

  # --- 2. Pipeline notebook references: Dev notebookId -> target notebookId -
  # Each activity in PL_Refresh_Master calls a notebook by its Dev GUID. After
  # the workspace replace above they would still point at the DEV notebook
  # (cross-workspace). These swap each Dev notebookId for the target-stage one.
  - find_value: "badd3f32-fe98-4f17-a06f-a6bf3bcc7a51"        # NB_Seed_Bronze (Dev)
    replace_value:
      Development: "$items.Notebook.NB_01_Seed_Bronze.$id"
      Production: "$items.Notebook.NB_01_Seed_Bronze.$id"
    item_type:
      - "DataPipeline"

  - find_value: "07790997-454f-4a23-a1e9-ae76b9cf4306"        # NB_Transform_Silver (Dev)
    replace_value:
      Development: "$items.Notebook.NB_02_Transform_Silver.$id"
      Production: "$items.Notebook.NB_02_Transform_Silver.$id"
    item_type:
      - "DataPipeline"

  - find_value: "bbd61d3a-98b6-489c-b2c9-573a5fa2d3f9"        # NB_Aggregate_GOLD (Dev)
    replace_value:
      Development: "$items.Notebook.NB_03_Aggregate_Gold.$id"
      Production: "$items.Notebook.NB_03_Aggregate_Gold.$id"
    item_type:
      - "DataPipeline"

  # If your live pipeline still has the NB_Setup activity, uncomment and map it.
  # (You said NB_00 was removed — leave commented if the activity is gone.)
  # - find_value: "ce35d36f-0a28-4ace-9be7-cb30a9ab5532"      # NB_Setup (Dev)
  #   replace_value:
  #     Development: "$items.Notebook.NB_00_Setup_Environment.$id"
  #     Production: "$items.Notebook.NB_00_Setup_Environment.$id"
  #   item_type:
  #     - "DataPipeline"

  # --- 3. Pipeline dataflow reference: Dev dataflowId -> target dataflowId ---
  - find_value: "b23c65fc-00fb-4df0-9f2e-eaf90cf6db80"        # DF_Gold (Dev)
    replace_value:
      Development: "$items.Dataflow.DF_Gold_PA.$id"
      Production: "$items.Dataflow.DF_Gold_PA.$id"
    item_type:
      - "DataPipeline"

  # --- 4. Pipeline SM-refresh activity: Dev datasetId -> target datasetId ----
  # The PBISemanticModelRefresh activity's groupId is handled by the workspace
  # replace (#1). Its datasetId still points at the Dev model, so swap it here.
  - find_value: "44ab3338-afb5-4da6-9b5d-14d76d997102"        # Gold_SM (Dev)
    replace_value:
      Development: "$items.SemanticModel.Gold_SM.$id"
      Production: "$items.SemanticModel.Gold_SM.$id"
    item_type:
      - "DataPipeline"

  # --- 5. DF_Gold_PA source parameters: Dev Silver lakehouse id -------------
  # mashup.pq SilverLakehouseId -> the target Silver_LH id. (SilverWorkspaceId
  # is the Dev workspace GUID, already handled by replace #1.)
  - find_value: "<DEV_SILVER_LH_GUID>"                        # Silver_LH (Dev) — fill in
    replace_value:
      Development: "$items.Lakehouse.Silver_LH.$id"
      Production: "$items.Lakehouse.Silver_LH.$id"
    item_type:
      - "Dataflow"

  # --- 6. Notebook default-lakehouse bindings -------------------------------
  # The default_lakehouse GUID in each notebook's binding is workspace-specific.
  # The default_lakehouse_workspace_id is fixed by replace #1; these fix the
  # lakehouse id itself. Fill in each Dev lakehouse GUID.
  - find_value: "<DEV_BRONZE_LH_GUID>"                        # Bronze_LH (Dev) — fill in
    replace_value:
      Development: "$items.Lakehouse.Bronze_LH.$id"
      Production: "$items.Lakehouse.Bronze_LH.$id"
    item_type:
      - "Notebook"

  - find_value: "<DEV_SILVER_LH_GUID>"                        # Silver_LH (Dev) — fill in
    replace_value:
      Development: "$items.Lakehouse.Silver_LH.$id"
      Production: "$items.Lakehouse.Silver_LH.$id"
    item_type:
      - "Notebook"

  - find_value: "<DEV_GOLD_LH_GUID>"                          # Gold_LH (Dev) — fill in
    replace_value:
      Development: "$items.Lakehouse.Gold_LH.$id"
      Production: "$items.Lakehouse.Gold_LH.$id"
    item_type:
      - "Notebook"

# ----------------------------------------------------------------------------
# 7. Gold_SM Direct Lake connection (replaces NB_04 Cell 10).
# Re-points the semantic model's Direct Lake connection per stage. Supply the
# target-stage CONNECTION id (a cloud connection object id, not the lakehouse).
# Remove this block if you keep doing the Direct Lake rebind in NB_04/sempy.
# ----------------------------------------------------------------------------
semantic_model_binding:
  - item_name: "Gold_SM"
    connection_id:
      Development: "<DEV_GOLD_SM_CONNECTION_GUID>"            # fill in
      Production: "<PROD_GOLD_SM_CONNECTION_GUID>"            # fill in
