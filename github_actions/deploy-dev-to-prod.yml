# GitHub Actions: deploy-dev-to-prod.yml
# Trigger: Merge to 'main' branch, or manual dispatch
# Action: Deploy ws-CICD-Dev → ws-CICD-Prod via Fabric Deployment Pipelines REST API
# ─────────────────────────────────────────────────────────────────────────────
# This is a 2-stage deployment pipeline (Development → Production). The Fabric
# Deployment Pipeline has stage order 0 = Development, 1 = Production.
#
# Required GitHub Secrets:
#   FABRIC_TENANT_ID       — Azure AD tenant ID
#   FABRIC_CLIENT_ID       — Service Principal (App Registration) client ID
#   FABRIC_CLIENT_SECRET   — Service Principal secret
#   FABRIC_PIPELINE_ID     — Fabric Deployment Pipeline ID (GUID)
#
# Note: Configure a GitHub Environment "production" with required reviewers so the
# promotion to Prod is gated by an explicit approval before it runs.
# ─────────────────────────────────────────────────────────────────────────────

name: "Fabric CD — Deploy Dev to Prod"

on:
  push:
    branches:
      - main
    paths:
      - 'fabric/**'   # Only trigger when Fabric item files change

  workflow_dispatch:  # Allow manual trigger
    inputs:
      deploy_note:
        description: "Deployment note (shown in Fabric pipeline history)"
        required: false
        default: "Manual deployment from GitHub Actions"

jobs:
  deploy-to-prod:
    name: "Deploy Dev → Prod"
    runs-on: ubuntu-latest
    environment: production   # GitHub Environment — requires reviewer approval

    steps:
      # ── Step 1: Checkout code ─────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Step 2: Acquire Fabric Bearer Token (Service Principal) ───────────
      - name: Acquire Fabric Token
        id: auth
        env:
          TENANT_ID:     ${{ secrets.FABRIC_TENANT_ID }}
          CLIENT_ID:     ${{ secrets.FABRIC_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.FABRIC_CLIENT_SECRET }}
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "client_id=${CLIENT_ID}" \
            -d "client_secret=${CLIENT_SECRET}" \
            -d "scope=https://api.fabric.microsoft.com/.default" \
            -d "grant_type=client_credentials")

          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')

          if [ "$ACCESS_TOKEN" == "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "❌ Failed to acquire token"
            echo "$RESPONSE" | jq .
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"
          echo "token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT
          echo "✅ Token acquired"

      # ── Step 3: Trigger Deployment Dev → Prod ────────────────────────────
      - name: Deploy Dev → Prod
        id: deploy
        env:
          PIPELINE_ID: ${{ secrets.FABRIC_PIPELINE_ID }}
          TOKEN:       ${{ steps.auth.outputs.token }}
          DEPLOY_NOTE: ${{ github.event.inputs.deploy_note || format('Auto-deploy from commit {0}', github.sha) }}
        run: |
          echo "Triggering deployment for pipeline: ${PIPELINE_ID}"
          echo "Commit: ${{ github.sha }}"
          echo "Note: ${DEPLOY_NOTE}"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.fabric.microsoft.com/v1/pipelines/${PIPELINE_ID}/deploy" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"sourceStageOrder\": 0,
              \"targetStageOrder\": 1,
              \"isBackwardDeployment\": false,
              \"updateAppSettings\": true,
              \"allowCreateArtifact\": true,
              \"allowOverwriteArtifact\": true,
              \"allowOverwriteTargetArtifactLabel\": true,
              \"note\": \"${DEPLOY_NOTE} | SHA: ${{ github.sha }} | Branch: ${{ github.ref_name }}\"
            }")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "HTTP Status: ${HTTP_CODE}"
          echo "Response: ${BODY}"

          if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 202 ]; then
            OPERATION_ID=$(echo "$BODY" | jq -r '.operationId // empty')
            echo "operation_id=$OPERATION_ID" >> $GITHUB_OUTPUT
            echo "✅ Deployment triggered. Operation ID: ${OPERATION_ID}"
          else
            echo "❌ Deployment failed with HTTP ${HTTP_CODE}"
            exit 1
          fi

      # ── Step 4: Poll for deployment completion ────────────────────────────
      - name: Wait for Deployment Completion
        env:
          PIPELINE_ID:  ${{ secrets.FABRIC_PIPELINE_ID }}
          TOKEN:        ${{ steps.auth.outputs.token }}
          OPERATION_ID: ${{ steps.deploy.outputs.operation_id }}
        run: |
          if [ -z "$OPERATION_ID" ]; then
            echo "No operation ID returned — deployment may be synchronous. Skipping poll."
            exit 0
          fi

          MAX_ATTEMPTS=30
          SLEEP_SECONDS=15
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Polling attempt ${ATTEMPT}/${MAX_ATTEMPTS}..."

            STATUS_RESPONSE=$(curl -s \
              "https://api.fabric.microsoft.com/v1/operations/${OPERATION_ID}" \
              -H "Authorization: Bearer ${TOKEN}")

            STATUS=$(echo "$STATUS_RESPONSE" | jq -r '.status // "Unknown"')
            echo "Status: ${STATUS}"

            if [ "$STATUS" == "Succeeded" ]; then
              echo "✅ Deployment to PROD completed successfully"
              exit 0
            elif [ "$STATUS" == "Failed" ] || [ "$STATUS" == "Cancelled" ]; then
              echo "❌ Deployment failed with status: ${STATUS}"
              echo "$STATUS_RESPONSE" | jq .
              exit 1
            fi

            sleep $SLEEP_SECONDS
          done

          echo "⚠️ Timed out waiting for deployment completion"
          exit 1

      # ── Step 5: Post deployment summary ──────────────────────────────────
      - name: Deployment Summary
        if: success()
        run: |
          echo "## 🚀 Fabric Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Dev → Prod |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Time | $(date -u +\"%Y-%m-%d %H:%M UTC\") |" >> $GITHUB_STEP_SUMMARY
