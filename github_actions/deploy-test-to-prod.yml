# GitHub Actions: deploy-test-to-prod.yml
# Trigger: Manual only (production deployments require explicit approval)
# Action: Deploy PAB-Test → PAB-Prod via Fabric Deployment Pipelines REST API
# ─────────────────────────────────────────────────────────────────────────────
# Note: Configure a GitHub Environment "production" with required reviewers
# to enforce approval before this workflow runs
# ─────────────────────────────────────────────────────────────────────────────

name: "Fabric CD — Deploy Test to Prod"

on:
  workflow_dispatch:
    inputs:
      deploy_note:
        description: "Production deployment reason / change reference"
        required: true
        default: "Approved release - see PR"
      confirm_prod:
        description: "Type DEPLOY to confirm production deployment"
        required: true
        default: ""

jobs:
  validate-input:
    name: "Validate Deployment Confirmation"
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_prod }}" != "DEPLOY" ]; then
            echo "❌ Production deployment requires typing DEPLOY in the confirmation field"
            exit 1
          fi
          echo "✅ Deployment confirmed"

  deploy-to-prod:
    name: "Deploy Test → Production"
    runs-on: ubuntu-latest
    needs: validate-input
    environment: production   # GitHub Environment — requires reviewer approval

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Acquire Fabric Token
        id: auth
        env:
          TENANT_ID:     ${{ secrets.FABRIC_TENANT_ID }}
          CLIENT_ID:     ${{ secrets.FABRIC_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.FABRIC_CLIENT_SECRET }}
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "client_id=${CLIENT_ID}" \
            -d "client_secret=${CLIENT_SECRET}" \
            -d "scope=https://api.fabric.microsoft.com/.default" \
            -d "grant_type=client_credentials")

          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          echo "::add-mask::$ACCESS_TOKEN"
          echo "token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT
          echo "✅ Token acquired"

      - name: Deploy Test → Production
        id: deploy
        env:
          PIPELINE_ID: ${{ secrets.FABRIC_PIPELINE_ID }}
          TOKEN:       ${{ steps.auth.outputs.token }}
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.fabric.microsoft.com/v1/pipelines/${PIPELINE_ID}/deploy" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"sourceStageOrder\": 1,
              \"targetStageOrder\": 2,
              \"isBackwardDeployment\": false,
              \"updateAppSettings\": true,
              \"allowCreateArtifact\": true,
              \"allowOverwriteArtifact\": true,
              \"note\": \"${{ github.event.inputs.deploy_note }} | SHA: ${{ github.sha }} | Actor: ${{ github.actor }}\"
            }")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          OPERATION_ID=$(echo "$BODY" | jq -r '.operationId // empty')
          echo "operation_id=$OPERATION_ID" >> $GITHUB_OUTPUT

          if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 202 ]; then
            echo "✅ Production deployment triggered. OperationId: ${OPERATION_ID}"
          else
            echo "❌ Deployment failed with HTTP ${HTTP_CODE}: ${BODY}"
            exit 1
          fi

      - name: Wait for Prod Deployment
        env:
          TOKEN:        ${{ steps.auth.outputs.token }}
          OPERATION_ID: ${{ steps.deploy.outputs.operation_id }}
        run: |
          if [ -z "$OPERATION_ID" ]; then exit 0; fi
          for i in $(seq 1 30); do
            sleep 15
            STATUS=$(curl -s \
              "https://api.fabric.microsoft.com/v1/operations/${OPERATION_ID}" \
              -H "Authorization: Bearer ${TOKEN}" | jq -r '.status // "Unknown"')
            echo "Poll $i: $STATUS"
            [ "$STATUS" == "Succeeded" ] && echo "✅ Production deployment complete!" && exit 0
            [ "$STATUS" == "Failed" ] && echo "❌ Deployment failed!" && exit 1
          done
          echo "⚠️ Timed out" && exit 1

      - name: Production Deployment Summary
        if: success()
        run: |
          echo "## 🚀 Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Test → Production |" >> $GITHUB_STEP_SUMMARY
          echo "| Approved by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Change note | ${{ github.event.inputs.deploy_note }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Time | $(date -u +\"%Y-%m-%d %H:%M UTC\") |" >> $GITHUB_STEP_SUMMARY
